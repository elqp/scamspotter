<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scam Spotter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Noto+Sans+SC:wght@400;700;900&display=swap">
<style>
[hidden]{display:none!important}
:root{
  --ground:#EAF2F6; --card:#FFFFFF; --ink:#14263A; --muted:#4A5F73; --line:#C9D8E2;
  --teal:#0B6E6A; --teal-d:#084F4C; --red:#B5301F; --red-bg:#FCE9E5; --green:#1B7A46; --green-bg:#E2F4E9;
  --gold:#F2B233; --scale:1;
  --display:'Fraunces','Noto Sans SC','PingFang SC','Microsoft YaHei',Georgia,serif; --body:'Atkinson Hyperlegible','Noto Sans SC','PingFang SC','Microsoft YaHei',Verdana,Arial,sans-serif;
}
html{font-size:calc(19px*var(--scale))}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);line-height:1.5;padding-inline:16px;padding-block:20px 60px}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.brand{font-family:var(--display);font-weight:900;font-size:1.15rem;display:flex;align-items:center;gap:8px}
.shield{width:1.6rem;height:1.8rem}
.size{border:2px solid var(--ink);background:var(--card);border-radius:10px;padding:6px 14px;font-weight:700}
.bar{height:14px;background:var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);transition:width .4s}
.meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin:8px 0 18px;font-weight:700}
.tag{display:inline-block;color:#fff;border-radius:6px;padding:2px 10px;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;background:var(--ink)}
.panel{position:relative;overflow:hidden;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:22px}
.q{font-size:1.45rem;margin:12px 0 16px}
.opts{display:grid;gap:12px}
.opt{width:100%;text-align:left;background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:14px 16px;font-size:1.05rem;font-weight:700;min-height:56px}
.opt:hover:not(:disabled){background:#F1F7FA}
.opt:disabled{cursor:default}
.opt.right{background:var(--green-bg);border-color:var(--green)}
.opt.wrong{background:var(--red-bg);border-color:var(--red);animation:shake .4s}
.two{grid-template-columns:1fr 1fr}
.two .opt{text-align:center;font-size:1.2rem;display:flex;gap:10px;align-items:center;justify-content:center}
.two .opt svg{width:1.6rem;height:1.6rem;flex:none}
.scam-btn:not(:disabled){border-color:var(--red)} .safe-btn:not(:disabled){border-color:var(--green)}
.fb{margin-top:18px;border-radius:14px;padding:16px 18px;position:relative;overflow:hidden}
.fb.good{background:var(--green-bg);border:2px solid var(--green)}
.fb.bad{background:var(--red-bg);border:2px solid var(--red)}
.fbh{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.fbh svg{width:2.6rem;height:2.6rem;flex:none}
.fb h3{font-size:1.3rem}
.fb p{margin:0 0 6px}
.tip{font-weight:700;background:rgba(255,255,255,.7);border-radius:10px;padding:8px 12px}
.go{margin-top:16px;background:var(--teal);color:#fff;border:0;border-radius:14px;padding:14px 26px;font-size:1.2rem;font-weight:700;min-height:56px}
.go:hover{background:var(--teal-d)}
.go.full{width:100%}
.hint{color:var(--muted);font-size:.9rem;margin:0 0 12px}

/* ---------- scenes ---------- */
.scene{margin-bottom:18px;position:relative}
.win{border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 6px 0 rgba(20,38,58,.12)}
.chrome{background:#DCE6EE;border-bottom:2px solid var(--ink);padding:8px 12px;display:flex;align-items:center;gap:10px}
.dots{display:flex;gap:5px}.dots i{width:10px;height:10px;border-radius:50%;background:#9FB2C2;display:block}
.urlbar{flex:1;background:#fff;border-radius:16px;padding:2px 12px;font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mail{padding:14px}
.who{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.av{width:2.6rem;height:2.6rem;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.2rem;flex:none}
.who b{display:block}.who small{color:var(--muted);word-break:break-all;font-size:.75rem;display:block}
.subj{font-family:var(--display);font-weight:700;font-size:1.15rem;margin-bottom:6px}
.mail p{margin:0 0 12px}
.fakebtn{display:inline-block;background:#1565C0;color:#fff;border-radius:8px;padding:10px 18px;font-weight:700}

.phone{width:min(300px,100%);margin:0 auto;border:3px solid var(--ink);border-radius:28px;background:#F4F7FA;padding:26px 14px 18px;position:relative;box-shadow:0 6px 0 rgba(20,38,58,.12)}
.phone:before{content:"";position:absolute;top:9px;left:50%;width:56px;height:6px;margin-left:-28px;background:var(--ink);border-radius:4px}
.phone .nm{text-align:center;font-size:.8rem;color:var(--muted);margin-bottom:10px;font-weight:700}
.bub{background:#E1E7EE;border-radius:18px 18px 18px 4px;padding:10px 14px;max-width:92%;margin-bottom:8px}
.bub.me{background:#0B6E6A;color:#fff;border-radius:18px 18px 4px 18px;margin-left:auto}
.bub.link{color:#1565C0;text-decoration:underline}

.callscr{background:linear-gradient(#22384F,#0F1D2B);color:#fff;border-color:#0F1D2B;text-align:center;padding-bottom:20px}
.callscr:before{background:#fff}
.ring{width:84px;height:84px;margin:8px auto 10px;border-radius:50%;display:grid;place-items:center;background:#54708A;position:relative}
.ring:before,.ring:after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid #7FE0A6;animation:pulse 1.8s infinite}
.ring:after{animation-delay:.9s}
.ring svg{width:44px;height:44px}
.callscr h4{font-family:var(--display);font-size:1.3rem;margin:0}
.callscr .sm{font-size:.8rem;opacity:.8;margin:2px 0 12px}
.says{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px;font-size:.95rem;margin-bottom:14px;text-align:left}
.cb{display:flex;justify-content:center;gap:34px}
.cb span{width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
.cb svg{width:22px;height:22px}

.vid{background:#0F1D2B;border-radius:12px;border:2px solid var(--ink);overflow:hidden;position:relative;box-shadow:0 6px 0 rgba(20,38,58,.12)}
.vid img.pic{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;object-position:50% 20%}
.vid.glitch img.pic{filter:drop-shadow(2px 0 0 rgba(255,0,80,.45)) drop-shadow(-2px 0 0 rgba(0,220,255,.45));animation:rgb 2.6s infinite steps(1)}
@keyframes rgb{0%,84%,100%{transform:none}88%{filter:drop-shadow(5px 0 0 rgba(255,0,80,.6)) drop-shadow(-5px 0 0 rgba(0,220,255,.6));transform:translateX(4px)}93%{filter:drop-shadow(-6px 0 0 rgba(255,0,80,.6)) drop-shadow(6px 0 0 rgba(0,220,255,.6));transform:translateX(-5px)}}
.fakeflag{max-width:60%;text-align:right;line-height:1.3;position:absolute;top:10px;right:10px;z-index:2;background:#111;color:#FFD76A;border:2px solid #FFD76A;font-size:.7rem;font-weight:700;letter-spacing:.08em;padding:2px 8px;border-radius:5px}
.vid svg.face{display:block;width:100%;height:auto;max-height:300px}
.live{position:absolute;top:10px;left:10px;background:#D32F2F;color:#fff;font-size:.7rem;font-weight:700;letter-spacing:.08em;padding:2px 8px;border-radius:5px}
.cap{background:rgba(0,0,0,.72);color:#fff;padding:8px 12px;font-size:.95rem}
.clue{position:absolute;background:var(--gold);color:var(--ink);font-weight:700;font-size:.75rem;border-radius:8px;padding:3px 8px;opacity:0;transform:scale(.6);transition:.4s;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.vid.reveal .clue{opacity:1;transform:none}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 2px,transparent 2px 4px);pointer-events:none;animation:flick 3s infinite}

.chat .bub{max-width:85%}

.pop{position:relative;background:#F7F7F7;height:190px;overflow:hidden}
.pop .fake{position:absolute;left:8%;right:8%;top:16px;background:#fff;border:3px solid #D32F2F;border-radius:10px;padding:10px 12px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.18);animation:wob 1.6s infinite}
.pop .fake b{color:#D32F2F;font-size:1.05rem;display:block}
.pop .fake .ph{display:inline-block;background:#D32F2F;color:#fff;font-weight:700;padding:6px 12px;border-radius:6px;margin-top:6px}
.pop .x{position:absolute;right:6px;top:2px;font-weight:700;color:var(--muted)}

.cafe{display:flex;align-items:center;gap:16px;background:#FFF3E0;border:2px solid var(--ink);border-radius:12px;padding:12px 16px;box-shadow:0 6px 0 rgba(20,38,58,.12)}
.cafe svg{width:74px;height:74px;flex:none}
.cafe b{display:block;font-family:var(--display);font-size:1.15rem}

.mt{display:block;height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.mt i{display:block;height:100%;border-radius:6px;transition:width .6s}
.mtl{display:block;font-size:.85rem;font-weight:400;margin-top:4px;color:var(--muted)}
.opt .pw{font-family:ui-monospace,Consolas,monospace;font-size:1.15rem}

.flag{display:inline;background:none;border:0;border-bottom:3px dashed var(--muted);padding:0 2px;font-size:inherit;font-weight:700;color:inherit}
.flag.on{background:#FFE08A;border-bottom-color:var(--ink)}
.flag.hit{background:var(--green-bg);border-bottom:3px solid var(--green)}
.flag.miss{background:var(--red-bg);border-bottom:3px solid var(--red)}

.hero{display:grid;gap:14px}
.hero h1{font-size:2.6rem;margin:6px 0}
.hero p{font-size:1.1rem;margin:0}
.hero svg.art{width:100%;max-width:360px;height:auto;margin:0 auto;display:block}
.topics{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0}
.topics span{border-radius:20px;padding:4px 14px;font-weight:700;font-size:.9rem;color:#fff}
.score{font-family:var(--display);font-weight:900;font-size:3.4rem;color:var(--teal)}
.badge{width:150px;height:170px;display:block;margin:6px auto;animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
.rules{padding-left:1.2rem;margin:10px 0}.rules li{margin-bottom:8px}
.review{border-top:2px solid var(--line);padding-top:10px;margin-top:10px}
.conf{position:absolute;top:0;width:8px;height:12px;border-radius:2px;animation:fall 1.4s ease-out forwards;pointer-events:none}
/* ---------- lottery ---------- */
.board{background:linear-gradient(#173A57,#0F2438);border:3px solid #0A1826;border-radius:20px;padding:20px 16px;box-shadow:0 8px 0 rgba(20,38,58,.2)}
.board .lead{color:#DCE9F2;text-align:center;margin:0 0 14px;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:440px;margin:0 auto 20px}
.ball{--bc:#B5301F;container-type:inline-size;aspect-ratio:1;border-radius:50%;background:var(--bc);display:grid;place-items:center;position:relative;transition:transform .08s,box-shadow .08s,opacity .3s;box-shadow:inset -5px -6px 0 rgba(0,0,0,.22)}
.ball:before{content:"";position:absolute;width:70%;height:70%;border-radius:50%;background:#fff}
.ball b{position:relative;font-family:var(--display);font-weight:900;font-size:19cqw;color:#14263A;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.ball.lit{transform:scale(1.18);z-index:2;box-shadow:0 0 0 5px #F2B233,0 0 26px 10px rgba(242,178,51,.9)}
.ball.win{animation:winb .5s 3}
.ball.ok,.ball.no{opacity:.5}
.ball.ok:after,.ball.no:after{position:absolute;right:-2px;top:-2px;width:1.4rem;height:1.4rem;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem;font-family:var(--body)}
.ball.ok:after{content:"\2713";background:var(--green)}
.ball.no:after{content:"\2717";background:var(--red)}
.spin{display:block;width:100%;max-width:440px;margin:0 auto;background:var(--gold);color:#14263A;border:0;border-radius:16px;padding:16px;font-family:var(--display);font-weight:900;font-size:1.6rem;letter-spacing:.03em;box-shadow:0 6px 0 #B8811A;min-height:64px}
.spin:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #B8811A}
.spin:disabled{opacity:.6;cursor:default}
.spin:not(:disabled){animation:beat 1.6s infinite}
.stats{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;font-weight:700}
.stats .snd{border:2px solid var(--ink);background:var(--card);border-radius:10px;padding:4px 12px;font-size:.85rem}
#sheet{position:fixed;inset:0;background:rgba(10,24,38,.72);overflow:auto;padding:16px;z-index:10}
#sheet .panel{max-width:720px;margin:0 auto}
.chip{display:inline-flex;align-items:center;gap:8px;background:#0F2438;color:#fff;border-radius:20px;padding:3px 14px 3px 4px;font-weight:700;margin-left:8px;font-size:.8rem}
.chip i{background:var(--gold);color:#14263A;border-radius:16px;padding:1px 10px;font-style:normal;font-family:var(--display);font-weight:900}
.letter{display:inline-grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;margin-right:12px;flex:none}
.opt.lt{display:flex;align-items:center}
.opt.lt.right .letter{background:var(--green)} .opt.lt.wrong .letter{background:var(--red)}
.opt.lt .txt{flex:1}
/* ---------- casino skin ---------- */
body{background:radial-gradient(ellipse at 50% 0,#4A0F2B 0,#240818 60%,#14040D 100%) fixed;color:#fff}
.brand{color:#FFD76A;text-shadow:0 0 12px rgba(255,190,60,.6)}
.size,.stats .snd{background:#2E1024;color:#FFD76A;border-color:#FFD76A}
.stats{color:#FFE9A8}
.panel{color:var(--ink);border:4px solid #F2B233;box-shadow:0 0 0 3px #7A4B00,0 0 28px rgba(242,178,51,.35)}
.neon{font-family:var(--display);font-weight:900;text-align:center;font-size:2rem;letter-spacing:.06em;color:#FFF3C9;text-shadow:0 0 6px #fff,0 0 14px #FF3B6B,0 0 30px #FF3B6B,0 0 50px #FF3B6B;margin:0 0 4px;animation:neon 3s infinite}
.neon small{display:block;font-size:.85rem;letter-spacing:.3em;color:#FFD76A;text-shadow:0 0 10px #F2B233;font-family:var(--body)}
.board{position:relative;background:radial-gradient(ellipse at 50% 30%,#0E6B4B,#073D2C 70%);border:6px solid #F2B233;border-radius:24px;padding:34px 16px 22px;box-shadow:0 0 0 4px #7A4B00,0 0 40px rgba(242,178,51,.45),inset 0 0 60px rgba(0,0,0,.5)}
.board:before,.board:after{content:"";position:absolute;left:14px;right:14px;height:10px;background:radial-gradient(circle,#FFF3C9 0 3px,#F2B233 4px 5px,transparent 6px) 0 0/22px 10px;animation:bulbs 1s steps(1) infinite}
.board:before{top:8px}.board:after{bottom:8px;animation-delay:.5s}
.board .lead{color:#E8F6EE}
.ball{box-shadow:inset -5px -6px 0 rgba(0,0,0,.28),0 4px 0 rgba(0,0,0,.35)}
.ball.lit{box-shadow:0 0 0 5px #FFD76A,0 0 30px 12px rgba(255,215,106,.95)}
.spin{background:radial-gradient(circle at 50% 20%,#FF5A5A,#C3121F 70%);color:#fff;border:5px solid #F2B233;box-shadow:0 7px 0 #7A0A12,0 0 24px rgba(255,60,60,.6);text-shadow:0 2px 0 rgba(0,0,0,.4);border-radius:60px;font-size:1.7rem}
.spin:active:not(:disabled){box-shadow:0 2px 0 #7A0A12,0 0 24px rgba(255,60,60,.6)}
.credit{display:flex;justify-content:space-between;gap:10px;background:#000;border:3px solid #F2B233;border-radius:10px;padding:6px 14px;margin:0 auto 16px;max-width:440px;font-family:ui-monospace,Consolas,monospace;color:#7CFF9B;text-shadow:0 0 8px #3CFF6B;font-size:1rem}
.credit b{color:#FF7A7A;text-shadow:0 0 8px #FF3B3B}
.hero{text-align:center}.hero .topics{justify-content:center}.hero .neon{text-align:center;color:#D8102A;text-shadow:0 0 4px #FFE600,0 0 12px #FFD400,0 0 24px #FFC400,0 0 40px #FFB800}
.hero .neon small{color:#000;text-shadow:0 0 4px #FFE600,0 0 10px #FFD400,0 0 20px #FFC400}
@keyframes neon{45%{opacity:.85}50%{opacity:1}52%{opacity:.7}54%{opacity:1}}
@keyframes bulbs{50%{opacity:.35}}
.top .r{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#lbbody .lbr small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
.lbr.me{background:#FFF3C9}
#sheet .go{margin-top:12px}
.modes{grid-template-columns:1fr 1fr}
.opt.sel{background:#FFF3C9;border-color:#B8811A;box-shadow:0 0 0 3px #F2B233}
.tin{display:flex;align-items:center;gap:12px;margin:10px 0}
.tin i{width:28px;height:28px;border-radius:50%;flex:none;border:3px solid #14263A}
.tin input{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:10px 12px;border:3px solid var(--ink);border-radius:10px}
.teams{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tm{flex:1;min-width:100px;border:4px solid var(--tc);background:#fff;color:var(--ink);border-radius:12px;padding:4px 10px;font-weight:700;text-align:center;opacity:.7;font-size:.9rem}
.tm b{display:block;font-family:var(--display);font-size:1.3rem}
.tm.on{opacity:1;box-shadow:0 0 0 3px #FFD76A,0 0 18px var(--tc);transform:scale(1.04)}
.turn{background:var(--tc);color:#fff;text-align:center;font-family:var(--display);font-weight:900;font-size:1.25rem;border-radius:12px;padding:8px;margin-bottom:14px;border:3px solid #FFD76A}
.lb{margin:6px 0}.lb h3{text-align:center;font-size:1.6rem;color:#B36B00;margin-bottom:10px}
.lbr{display:grid;grid-template-columns:2rem 1fr auto auto;gap:10px;align-items:center;border:3px solid var(--tc);border-radius:12px;padding:8px 12px;margin-bottom:8px;font-size:1rem}
.lbr span{background:var(--tc);color:#fff;border-radius:50%;width:2rem;height:2rem;display:grid;place-items:center;font-weight:700}
.lbr em{font-style:normal;color:var(--muted);font-size:.85rem}
.lbr strong{font-family:var(--display);font-size:1.2rem}
.spark{position:fixed;z-index:40;width:8px;height:8px;border-radius:50%;pointer-events:none;box-shadow:0 0 8px currentColor;animation:spark 1.2s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.coin{position:fixed;top:-40px;z-index:30;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF3C9,#F2B233 60%,#B8811A);border:3px solid #B8811A;color:#7A4B00;font-weight:900;display:grid;place-items:center;pointer-events:none;animation:coinfall 1.6s ease-in forwards}
@keyframes coinfall{to{transform:translateY(110vh) rotateY(720deg)}}
@keyframes winb{50%{transform:scale(1.3)}}
@keyframes beat{50%{transform:scale(1.03)}}
@keyframes fall{from{transform:translateY(-10px) rotate(0);opacity:1}to{transform:translateY(160px) rotate(540deg);opacity:0}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(1.7);opacity:0}}
@keyframes wob{50%{transform:translateY(-4px) rotate(-.6deg)}}
@keyframes flick{50%{opacity:.4}}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@media (max-width:480px){.two{grid-template-columns:1fr}.hero h1{font-size:2.1rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <div class="top">
    <div class="brand"><svg class="shield" viewBox="0 0 24 28" aria-hidden="true"><path d="M12 1 2 5v8c0 6 4.2 11 10 14 5.8-3 10-8 10-14V5z" fill="#0B6E6A"/><path d="m7 14 4 4 7-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Scam Spotter</div>
    <div class="r"><button class="size" id="langbtn">中文</button><button class="size" id="lbbtn">&#127942; Leaderboard</button><button class="size" id="size" aria-label="Change text size">Text size: A</button></div>
  </div>
  <div id="app"></div>
  <div id="sheet" role="dialog" aria-modal="true" aria-label="Question" hidden></div>
</div>

const Q=[
{topic:'Phishing',type:'judge',v:{k:'email',name:'Your Bank',addr:'security@your-bank-secure-login.com',c:'#B5301F',l:'B',sub:'URGENT: Account locked!',body:'Dear customer, we noticed strange activity. Confirm your password within 24 hours or your account will be closed.',btn:'Verify my account'},answer:'scam',
 why:'Real banks never ask for your password by email, and they do not threaten you with a deadline. The sender address is also odd: it is not your bank\'s real one.',tip:'Never click links in a worrying message. Open your bank\'s app or call the number on your card.'},
{topic:'Phishing',type:'judge',v:{k:'sms',name:'Sunshine Pharmacy',msgs:['Hi Mrs. Tan, your prescription is ready. Pick up any time before 6pm. No reply needed.']},answer:'safe',
 why:'No link, no rush, no request for money or personal details, and it is from a place you actually use. Not every message is a scam!',tip:'Ask: does it push me to click, hurry, or pay? If not, it is probably fine.'},
{topic:'Phishing',type:'flags',v:{k:'sms',name:'Unknown number'},
 segs:[['CONGRATULATIONS!! You have WON $5,000!',"A prize for a contest you never entered."],[' Click ',''],['http://prize-claim.top',"A strange web address - not a real company."],[' now. Pay a small $20 fee with ',''],['gift cards',"Only scammers ask to be paid in gift cards."],[' to release your prize. ',''],['Offer ends TODAY!',"Fake rush - scammers want you to panic, not think."]]},
{topic:'Social engineering',type:'choice',v:{k:'call',name:'Tax Office',sub:'Incoming call',says:'"You owe back taxes. Pay $1,800 today with gift cards, or the police will arrest you."'},
 q:'What do you do?',opts:['Hang up, then look up the real tax office number and call them myself','Buy the gift cards to be safe','Ask him to explain and give my ID number to prove who I am'],answer:0,
 why:'Real government offices never demand gift cards and never threaten arrest by phone. Scammers use fear and speed so you cannot think.',tip:'Hang up. You are allowed to be rude to a stranger who is pressuring you.'},
{topic:'Social engineering',type:'choice',v:{k:'call',name:'Unknown number',sub:'Incoming call',says:'"Grandma? It\'s me... I\'m in jail. Please don\'t tell Mom. Send money right now!"'},
 q:'What is the smartest first step?',opts:['Send the money quickly - family comes first','Hang up and call my grandchild on the number I already have','Ask "Which grandchild are you?" and trust the name they say'],answer:1,
 why:'This is the "grandparent scam". Voices can be copied by computers now, and scammers count on secrecy and panic.',tip:'Agree a family secret word ahead of time. No word, no money.'},
{topic:'Passwords',type:'choice',v:{k:'pw'},q:'Which password is the strongest?',opts:['Fluffy1985','Bluetiger82!piano1','password123'],meters:[[1,'A computer cracks it in hours'],[4,'Would take centuries to crack'],[0,'Cracked instantly']],answer:1,
 why:'Bluetiger82!piano1 is the strongest because it mixes UPPERCASE and lowercase letters, numbers and a symbol (!), and it is much longer than 8 characters. A pet name with a birth year is one of the first things thieves try, and "password123" is the first.',tip:'Mix uppercase, lowercase, numbers and symbols, and use more than 8 characters.'},
{topic:'Passwords',type:'choice',v:{k:'keys'},q:'What is the safest way to handle many accounts?',opts:['Use one good password everywhere so I never forget it','A different password for each account, kept in a password manager','Use my birthday - it is easy'],answer:1,
 why:'If one website is hacked, thieves try that same password on your email and bank. A password manager is a safe app that remembers all your passwords behind one strong master password, so you never need to reuse or write them down.',tip:'Never reuse your email password. Email can reset all your other accounts.'},
{topic:'Deepfakes',type:'choice',v:{k:'video',photo:true,pos:'50% 22%',name:'Your Bank Manager',cap:'"Your savings are at risk. Move them to this safe account with me right now."',clues:[['Real-looking face does not mean real',10,72]]},
 q:'The face looks completely real. What do you do?',opts:['Follow the manager\'s instructions - I can see them','End the call and phone the bank on the number printed on my bank card','Stay on the call but ask them a few questions'],answer:1,
 why:'Computers can now create fake faces and voices that look real. Looking real is no longer proof. No real bank asks you to move money to a "safe account".',tip:'Trust the channel you choose, not the one that contacted you.'},
{topic:'Deepfakes',type:'choice',v:{k:'video',bad:true,photo:'doc',glitch:true,pos:'50% 38%',name:'Famous doctor',cap:'"This miracle cure fixes everything. Only 3 bottles left - order now!"',clues:[['Glitchy picture',4,62],['Blurry edge',56,42],['Too good to be true',50,6]]},
 q:'A video online shows a famous doctor promising a miracle cure. What is the best move?',opts:['Share it - it could help my friends','Check the doctor\'s official website or trusted news before believing it','Buy the product before it sells out'],answer:1,
 why:'Fake videos often have mismatched lips, odd blinking, blurry edges around the face, or a flat voice. Miracle cures and "act now" offers are big warning signs.',tip:'Pause before you share. If it sounds too good to be true, look it up.'},
{topic:'Social engineering',type:'choice',v:{k:'chat',name:'Daniel, online friend',msgs:[['them','Good morning my dear! Thinking of you.'],['them','I am in hospital abroad. I need $2,000 today. Please help me.'],['them','I cannot video call, my phone is broken.']]},
 q:'A kind person you met online has chatted with you for weeks. What do you do?',opts:['Send it - they have been so kind','Say no, and tell a family member or friend about it','Send half to be safe'],answer:1,
 why:'This is a "romance" or "friendship" scam. The criminal builds trust for weeks, then invents an emergency. They often say they cannot video call.',tip:'Never send money to someone you have only met online.'},
{topic:'Online safety',type:'choice',v:{k:'popup'},q:'A pop-up shouts: "VIRUS FOUND! Call this number now!" What do you do?',opts:['Call the number - they can fix it','Close the window or turn off the device, and do not call','Click "Scan now"'],answer:1,
 why:'Real security warnings do not show a phone number. The people who answer will ask to control your computer and charge you.',tip:'A pop-up is not your computer talking. Close it.'},
{topic:'Online safety',type:'choice',v:{k:'call',name:'Bank Security Team',sub:'Incoming call',says:'"To stop a fraud, please read us the 6-digit code we just sent to your phone."'},
 q:'What do you do?',opts:['Read the code - they are protecting me','Hang up. That code is only for me and I never share it','Read only the first 3 digits'],answer:1,
 why:'That code is the key to your account. The bank sent it because the scammer is trying to log in as you at that very moment.',tip:'No real company will ever ask you to read out a code.'},
{topic:'Online safety',type:'choice',v:{k:'wifi'},q:'You want to check your bank balance on the free cafe Wi-Fi. What is best?',opts:['Go ahead - the Wi-Fi has a password','Wait until I am home, or use my phone\'s mobile data','Log in, but be quick'],answer:1,
 why:'Public Wi-Fi can be watched by strangers. It is fine for reading news, but not for banking or shopping.',tip:'Banking and shopping: home Wi-Fi or mobile data only.'},
{topic:'Phishing',type:'choice',v:{k:'sms',name:'Parcel Delivery',msgs:['Your parcel is on hold. Pay a $1.99 redelivery fee within 12 hours:','http://parcel-fee.example/pay']},
 q:'You are not sure if you are waiting for a parcel. What do you do?',opts:['Tap the link and pay - it is only $1.99','Ignore the link and check my order on the shop\'s or courier\'s official app or website','Reply to the text to ask who they are'],answer:1,
 why:'The small fee is bait. The real goal is your card details. Even replying tells scammers your number is active.',tip:'Small fees and short deadlines are classic bait. Go to the official site yourself.'},
{topic:'Online safety',type:'choice',v:{k:'note',c:'#0B6E6A',t:'Two-step verification',s:'A code is sent to your phone when you sign in.',d:'M8 3h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm4 15v.5'},
 q:'What does "two-step verification" do for you?',opts:['It makes my password longer automatically','It adds a second check, like a code sent to my phone, so a stolen password alone is not enough','It lets my bank log in for me'],answer:1,
 why:'Even if a thief learns your password, they still cannot get in without the second step. It is one of the best free protections you can turn on.',tip:'Turn on two-step verification for email and banking.'},
{topic:'Social engineering',type:'choice',v:{k:'call',name:'"Computer Support"',sub:'Incoming call',says:'"We detected a problem with your computer. Please install this program so we can fix it."'},
 q:'What do you do?',opts:['Install it - they know about my computer','Hang up. Real companies do not phone me about my computer','Let them fix it but watch closely'],answer:1,
 why:'These callers want remote control of your computer to steal from you or charge for a fake fix.',tip:'Never let a caller take control of your computer.'},
{topic:'Phishing',type:'choice',v:{k:'qr'},
 q:'A sticker on a parking meter has a QR code to "pay for parking". What is safest?',opts:['Scan it and enter my card details','Pay at the meter itself or with the official parking app','Scan it, but only enter half my card number'],answer:1,
 why:'Criminals stick fake QR codes over real ones. The page you land on looks real but steals your card details.',tip:'Be careful with QR codes stuck on public signs.'},
{topic:'Online safety',type:'judge',v:{k:'sms',name:'Your phone maker',msgs:['A software update is ready. To install it, open Settings, then Software Update. No link needed.']},answer:'safe',
 why:'It gives no link and no rush, and it tells you to go to your own Settings. Updates fix security holes, so installing them is a good habit.',tip:'Update from your own Settings, never from a link in a message.'},
{topic:'Social engineering',type:'choice',v:{k:'note',c:'#B36B00',t:'A knock at the door',s:'"I am from the electricity company. I must check your meter now." No badge shown.',d:'M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16M6 21h12M14 12v.5'},
 q:'What do you do?',opts:['Let them in - they sound official','Ask for ID through the door, and phone the company on the number from my bill','Let them in but stay next to them'],answer:1,
 why:'Scammers dress and talk the part. Real staff are happy to wait while you check.',tip:'A real visitor never minds waiting while you check.'},
{topic:'Deepfakes',type:'choice',v:{k:'sms',name:'Voice message: "Your son"',msgs:['&#9654; 0:12 "Mum, my phone broke, this is a new number. I need you to pay a bill for me right now, please!"']},
 q:'It really sounds like your son. What is the best move?',opts:['Pay it - it is his voice','Call him on the number I already have, or ask for our family secret word','Reply asking questions by message only'],answer:1,
 why:'A few seconds of anyone\'s voice is enough for a computer to copy it. "New number, urgent money" is the giveaway.',tip:'A voice is no longer proof. Confirm on a number you already have.'},
{topic:'Phishing',type:'judge',v:{k:'email',name:'Tax Refund Service',addr:'refund@tax-office-payments.example',c:'#B36B00',l:'T',sub:'You are owed $482.00',body:'Good news! To receive your refund today, enter your bank login and card number on our secure form.',btn:'Claim my refund'},answer:'scam',
 why:'Tax offices do not email you refunds or ask for your bank login. A surprise "refund" that needs your details is bait.',tip:'Never type bank details into a page you reached from an email.'},
{topic:'Phishing',type:'judge',v:{k:'email',name:'Power Company',addr:'no-reply@yourpowerco.example',c:'#1565C0',l:'P',sub:'Your monthly bill is ready',body:'Your bill is now available. Sign in through the app or website you normally use to see it. There is nothing to click here.',btn:'(No button)'},answer:'safe',
 why:'It asks you to use the app or site you already know, with no link, no rush and no threat. That is how real companies write.',tip:'Safe messages send you to places you already trust.'},
{topic:'Passwords',type:'choice',v:{k:'keys'},q:'Where is a good place to keep your passwords?',opts:['On a sticky note on my computer screen','In a password manager','In my phone notes, called "Passwords"'],answer:1,

function ping(f,at,dur,vol){try{const t=ac.currentTime+at,o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.005);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}

function whistle(at,dur){try{const t=ac.currentTime+at,o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(500,t);o.frequency.exponentialRampToValueAtTime(2200,t+dur);g.gain.setValueAtTime(.03,t);g.gain.linearRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur)}catch(e){}}

    catch(e){body.innerHTML='<p class="hint">Could not load scores. Please press Refresh.</p>'}
    ref.disabled=false;ref.textContent='Refresh scores'};
  ref.onclick=load;load()}

function setup(n){
  app.innerHTML=`<div class="panel"><div class="neon">WHO IS PLAYING?<small>CHOOSE YOUR TABLE</small></div>
  <div class="opts modes">${[1,2,3,4].map(k=>`<button class="opt ${k===n?'sel':''}" data-n="${k}">${k===1?'Just me (solo)':k+' teams'}</button>`).join('')}</div>
  ${n>1?`<p class="hint" style="margin-top:14px">Name your teams. Teams take turns spinning, and the most coins wins.${n>=3?" With 3 or 4 teams you play 30 balls.":""}</p>${TEAMC.slice(0,n).map((c,k)=>`<label class="tin" for="tn${k}"><i style="background:${c[0]}"></i><input id="tn${k}" maxlength="16" value="Team ${c[1]}"></label>`).join('')}`:'<p class="hint" style="margin-top:14px">Play on your own and try to win the most coins. Your name goes on the leaderboard.</p><label class="tin" for="pn"><i style="background:#F2B233"></i><input id="pn" maxlength="16" placeholder="Your name"></label>'}
  <button class="go full" id="deal">Deal me in</button></div>`;
  app.querySelectorAll('.modes .opt').forEach(b=>b.onclick=()=>setup(+b.dataset.n));
  document.getElementById('deal').onclick=()=>{
    const nm=s=>(s||'').trim().slice(0,16);
    teams=n===1?(()=>{const r=nm(document.getElementById('pn').value)||'Player';return [{name:esc(r),raw:r,color:'#F2B233',coins:0,right:0,wrong:0}]})():TEAMC.slice(0,n).map((c,k)=>{const r=nm(document.getElementById('tn'+k).value)||'Team '+c[1];return {name:esc(r),raw:r,color:c[0],coins:0,right:0,wrong:0}});
    N=teams.length>=3?30:20;newGame()};
}

function newGame(){
  const s=new Set();while(s.size<N)s.add(1000+Math.floor(Math.random()*9000));
  balls=[...s];order=shuffle(Q.map((q,k)=>k));state=Array(N).fill(null);score=0;missed=[];pos=0;busy=false;bonusDone=false;bonusSeen={};turn=0;owner=Array(N).fill(null);teams=teams.map(t=>({...t,coins:0,right:0,wrong:0}));
  board()}

function openBonus(){
  bonusDone=true;bonusSeen[played()]=true;const BT=[...teams].sort((a,b)=>a.coins-b.coins)[0];const items=shuffle(BONUS).slice(0,3);let n=0,right=0;
  const bank=()=>`<div class="credit" style="margin:0 0 14px"><span>BONUS</span><span>${BT.name.toUpperCase()} <b>${BT.coins}</b></span></div>`;
  function card(){
    const it=items[n];
    sheet.innerHTML=`<div class="panel"><div class="neon" style="font-size:1.6rem">BONUS ROUND<small>CARD ${n+1} OF 3 &middot; +200 COINS EACH</small></div>${bank()}<h2 class="q" style="text-align:center">Scam or safe?</h2><div class="scene"><div class="phone"><div class="nm">New message</div><div class="bub">${it.m}</div></div></div><div class="opts two"><button class="opt scam-btn" data-a="scam">${WARN}Scam</button><button class="opt safe-btn" data-a="safe">Safe</button></div><div id="fbk"></div></div>`;
    sheet.scrollTop=0;
    sheet.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok=b.dataset.a===it.a;
      sheet.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.a===it.a)x.classList.add('right')});
      if(ok){right++;BT.coins+=200;shower(4);fanfare()}else{b.classList.add('wrong');tone(160,.3,.08)}
      const last=n===2;
      document.getElementById('fbk').innerHTML=`<div class="fb ${ok?'good':'bad'}"><div class="fbh">${ok?CHK:CRS}<h3>${ok?'+200 coins!':'Not this time'}</h3></div><p>${it.why}</p></div><button class="go full" id="nx">${last?'Collect my coins':'Next card'}</button>`;
      document.getElementById('nx').scrollIntoView({block:'nearest'});
      document.getElementById('nx').onclick=()=>{n++;last?fin():card()}});
  }
  function fin(){
    const all=right===3;if(all){BT.coins+=300;shower(14);fireworks()}
    sheet.innerHTML=`<div class="panel"><div class="neon">${all?'BONUS JACKPOT!':'BONUS DONE'}<small>${right} OF 3 RIGHT</small></div><p style="text-align:center;font-size:1.2rem">${all?'Perfect! You earned a <b>+300 coin</b> jackpot.':'Nice try! Get all 3 next time for a 300 coin jackpot.'}</p>${bank()}<button class="go full" id="bk">Back to the lottery</button></div>`;
    document.getElementById('bk').onclick=()=>{sheet.hidden=true;sheet.innerHTML='';board()};
  }
  sheet.hidden=false;
  sheet.innerHTML=`<div class="panel"><div class="neon">BONUS ROUND<small>LIGHTNING SPIN</small></div><p style="text-align:center;font-size:1.15rem">You reached ${played()} balls! Three quick cards. Each right answer wins <b>200 coins</b>. All three wins a <b>300 coin jackpot</b>!</p><button class="go full" id="bs">Play the bonus</button></div>`;
  fanfare();shower(6);document.getElementById('bs').onclick=card;
}

function played(){return state.filter(x=>x!==null).length}
function board(){
  app.innerHTML=`<div class="stats"><span>Played: ${played()} of ${N}</span><span>${teams.length>1?"Ball "+(played()+1)+" of "+N:"Coins: &#9679; "+T().coins}</span><button class="snd" id="snd">Sound: ${sound?'on':'off'}</button></div>
  ${teamBar()}<div class="board"><div class="neon">JACKPOT<small>SPIN TO PLAY</small></div><div class="credit"><span>LUCKY ${N}</span><span>${teams.length>1?T().name.toUpperCase():(played()<10&&!bonusDone?"BONUS AT 10":"COINS")} <b>${T().coins}</b></span></div>
  <div class="grid" style="grid-template-columns:repeat(${N>20?5:4},1fr)">${balls.map((n,k)=>`<div class="ball ${state[k]===true?'ok':state[k]===false?'no':''}" id="b${k}" style="--bc:${BC[k%5]};${owner[k]!=null&&teams.length>1?'outline:5px solid '+teams[owner[k]].color+';outline-offset:2px':''}"><b>${n}</b></div>`).join('')}</div>
  <button class="spin" id="spin">${teams.length>1?T().name.toUpperCase()+': SPIN!':'PRESS TO SPIN'}</button></div>`;
  document.getElementById('spin').onclick=spin;
  document.getElementById('snd').onclick=e=>{sound=!sound;e.target.textContent='Sound: '+(sound?'on':'off')};
}

function spin(){
  if(busy)return;busy=true;
  const btn=document.getElementById('spin');btn.disabled=true;btn.textContent='GOOD LUCK...';
  const free=state.map((s,k)=>s===null?k:-1).filter(k=>k>=0);
  const t=free[Math.floor(Math.random()*free.length)];
  const steps=2*N+((t-pos+N)%N||N);let k=0,prev=pos;
  (function go(){
    k++;const idx=(pos+k)%N;
    document.getElementById('b'+prev).classList.remove('lit');
    document.getElementById('b'+idx).classList.add('lit');
    tone(300+ (k%N)*18,.05,.04);prev=idx;
    if(k<steps){setTimeout(go,45+Math.pow(k/steps,4)*420)}
    else{pos=t;const el=document.getElementById('b'+t);el.classList.add('win');fanfare();setTimeout(()=>openQ(t),1500)}
  })();
}

function letters(){return ['A','B','C','D']}
function openQ(t){
  cur=t;const q=Q[order[t]];sel=new Set();let body='';
  const chip=`<span class="chip"><i>${balls[t]}</i> ${teams.length>1?T().name:'Your ball'}</span>`;
  if(q.type==='judge'){
    body=`<div>${tag(q.topic)}${chip}</div><h2 class="q">Is this a scam or safe?</h2>${scene(q)}<div class="opts two"><button class="opt scam-btn" data-a="scam">${WARN}Scam</button><button class="opt safe-btn" data-a="safe"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#1B7A46"/><path d="m6.5 12.5 4 4 7-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Safe</button></div><div id="fbk"></div>`;
  } else if(q.type==='flags'){
    body=`<div>${tag(q.topic)}${chip}</div><h2 class="q">Tap every warning sign</h2><p class="hint">Tap the parts that look like a scam - they turn yellow. Tap again to undo. Then press Check.</p>${scene(q)}<button class="go full" id="check">Check my answers</button><div id="fbk"></div>`;
  } else {
    const ord=q.meters?[0,1,2]:shuffle(q.opts.map((o,k)=>k));
    body=`<div>${tag(q.topic)}${chip}</div><h2 class="q">${q.q}</h2>${scene(q)}<div class="opts">${ord.map((k,pi)=>`<button class="opt lt" data-k="${k}"><span class="letter">${letters()[pi]}</span><span class="txt">${q.v.k==='pw'?`<span class="pw">${q.opts[k]}</span>`:q.opts[k]}<span class="mt" hidden><i style="width:0"></i></span><span class="mtl" hidden></span></span></button>`).join('')}</div><div id="fbk"></div>`;
  }
  sheet.innerHTML=`<div class="panel" style="border-color:${T().color}">${body}</div>`;sheet.hidden=false;sheet.scrollTop=0;
  const fb=document.getElementById('fbk');
  if(q.type==='flags'){
    const bub=document.createElement('div');bub.className='bub';
    bub.innerHTML=q.segs.map((s,k)=>s[1]?`<button class="flag" data-k="${k}" aria-pressed="false">${s[0]}</button>`:s[0]).join('');
    document.getElementById('smsflags').appendChild(bub);
  }
  if(q.type==='judge'){
    sheet.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok=b.dataset.a===q.answer;
      sheet.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.a===q.answer)x.classList.add('right')});
      if(!ok)b.classList.add('wrong');
      fb.innerHTML=feedback(ok,q);wireNext(ok)});
  } else if(q.type==='flags'){
    sheet.querySelectorAll('.flag').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;sel.has(k)?sel.delete(k):sel.add(k);b.classList.toggle('on');b.setAttribute('aria-pressed',sel.has(k))});
    document.getElementById('check').onclick=function(){
      const real=q.segs.map((s,k)=>s[1]?k:-1).filter(k=>k>=0);
      const found=real.filter(k=>sel.has(k)).length;
      sheet.querySelectorAll('.flag').forEach(b=>{const k=+b.dataset.k;b.disabled=true;b.classList.remove('on');b.classList.add(sel.has(k)?'hit':'miss')});
      this.remove();
      const ok=found===real.length;
      const list=`<ul class="rules">${real.map(k=>`<li><b>${q.segs[k][0].trim()}</b> - ${q.segs[k][1]}</li>`).join('')}</ul>`;
      const q2={...q,tip:'A prize you did not enter, a strange link, gift cards, and a rush are the classic four.'};
      fb.innerHTML=feedback(ok,q2,`<p>You found ${found} of ${real.length} warning signs. Green = you caught it, red = missed.</p>`,list);
      wireNext(ok)};
  } else {
    sheet.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k,ok=k===q.answer;
      sheet.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===q.answer)x.classList.add('right');
        if(q.meters){const m=q.meters[+x.dataset.k];const bar=x.querySelector('.mt');bar.hidden=false;x.querySelector('.mtl').hidden=false;x.querySelector('.mtl').textContent=m[1];const col=['#B5301F','#D9701A','#D9A81A','#7AA82A','#1B7A46'][m[0]];const f=bar.firstChild;f.style.background=col;requestAnimationFrame(()=>f.style.width=(m[0]*25+(m[0]?0:6))+'%')}});
      if(!ok)b.classList.add('wrong');
      fb.innerHTML=feedback(ok,q);wireNext(ok)});
  }
}

function confetti(el){const c=['#F2B233','#0B6E6A','#B5301F','#1565C0','#7A3E9D'];for(let k=0;k<30;k++){const s=document.createElement('span');s.className='conf';s.style.left=Math.random()*100+'%';s.style.background=c[k%5];s.style.animationDelay=Math.random()*.3+'s';el.appendChild(s)}}
function feedback(ok,q,extra,whyHtml){
  state[cur]=ok;owner[cur]=turn;if(ok){score++;T().right++}else{missed.push(q);T().wrong++}
  const last=played()===N;
  if(ok){T().coins+=100;fanfare();shower(4)}else tone(160,.3,.08);
  return `<div class="fb ${ok?'good':'bad'}" role="status"><div class="fbh">${ok?CHK:CRS}<h3>${ok?'JACKPOT! +100 coins':'Not quite - good to learn this'}</h3></div>${extra||''}${whyHtml||`<p>${q.why}</p>`}<p class="tip">Remember: ${q.tip}</p></div><button class="go full" id="next">${last?'See my results':'Back to the lottery'}</button>`}
function wireNext(ok){const n=document.getElementById('next');n.scrollIntoView({block:'nearest'});n.focus({preventScroll:true});if(ok)confetti(document.querySelector('.fb'));const v=document.getElementById('vid');if(v)v.classList.add('reveal');
  n.onclick=()=>{sheet.hidden=true;sheet.innerHTML="";busy=false;turn=(turn+1)%teams.length;played()===N?end():(played()%10===0&&!bonusSeen[played()]?openBonus():board())}}

function end(again){
  const pct=score/N;
  const rk=[...teams].sort((a,b)=>b.coins-a.coins);const tie=rk[1]&&rk[1].coins===rk[0].coins;
  const lb=`<div class="lb"><h3>${tie?'It is a tie!':rk[0].name+' wins!'}</h3>${rk.map((t,k)=>`<div class="lbr" style="--tc:${t.color}"><span>${k+1}</span><b>${t.name}</b><em>${t.right} right</em><strong>&#9679; ${t.coins}</strong></div>`).join('')}</div>`;
  const rank=pct>=.9?'Scam Buster Champion':pct>=.7?'Sharp-Eyed Guardian':pct>=.5?'Getting Savvy':'Learning Fast';
  const stars=pct>=.9?3:pct>=.7?2:1;
  const m=missed.length?`<h3>Worth another look</h3>${missed.map(q=>`<div class="review">${tag(q.topic)} ${q.tip}</div>`).join('')}`:'<p><b>A perfect round - nothing missed!</b></p>';
  const st=[0,1,2].map(k=>`<path transform="translate(${40+k*40} 118)" d="m0-22 6 14 15 1-11 10 4 15-14-8-14 8 4-15-11-10 15-1z" fill="${k<stars?'#F2B233':'#C9D8E2'}"/>`).join('');
  app.innerHTML=`<div class="panel"><div class="neon">YOU HIT THE JACKPOT!<small>ALL ${N} BALLS PLAYED</small></div>
  <svg class="badge" viewBox="0 0 160 180" role="img" aria-label="${stars} of 3 stars"><path d="M80 4 12 30v50c0 44 30 76 68 94 38-18 68-50 68-94V30z" fill="#0B6E6A"/><path d="M80 18 26 38v42c0 34 24 60 54 76 30-16 54-42 54-76V38z" fill="#0E8A85"/>${st}<text x="80" y="70" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-weight="900" font-size="34" fill="#fff">${score}/${N}</text></svg>
  <h2 style="text-align:center">${rank}</h2><p style="text-align:center;font-size:1.3rem;font-weight:700;color:#B36B00">${teams.length>1?lb:`&#9679; ${T().coins} coins won`}</p><p style="text-align:center">You are protecting yourself and the people you love. Share these six rules with a friend.</p><h3>The six golden rules</h3><ol class="rules">${RULES.map(r=>`<li>${r}</li>`).join('')}</ol>${m}<p class="hint" id="savestat" style="margin-top:14px">Saving your score...</p><button class="go full" id="viewlb" style="background:#B36B00">&#127942; View leaderboard</button><button class="go full" id="again">Play again</button></div>`;
  document.getElementById('again').onclick=newGame;
  document.getElementById('viewlb').onclick=()=>openBoard(N);
  const sm=document.getElementById("savestat");
  if(again){if(sm&&saveMsg)sm.textContent=saveMsg;window.scrollTo(0,0);return}
  const setMsg=t=>{saveMsg=t;const e=document.getElementById("savestat");if(e)e.textContent=t};
  saveScores().then(m=>setMsg(m==="shared"?"Score saved to the shared leaderboard.":"Score saved on this device.")).catch(()=>setMsg("Could not save your score to the leaderboard."));window.scrollTo(0,0);fanfare();fireworks();shower(10);confetti(document.querySelector(".panel"))}

d to be true, look it up.":"转发之前先停一停。如果听起来好得不像真的，就去查证。","Daniel, online friend":"丹尼尔，网友","Good morning my dear! Thinking of you.":"亲爱的，早上好！在想你。","I am in hospital abroad. I need $2,000 today. Please help me.":"我在国外住院了。我今天需要 $2,000。请帮帮我。","I cannot video call, my phone is broken.":"我不能视频通话，我的手机坏了。","A kind person you met online has chatted with you for weeks. What do you do?":"一位您在网上认识的好心人和您聊了几个星期。您会怎么做？","Send it - they have been so kind":"汇给他——他一直那么友善","Say no, and tell a family member or friend about it":"拒绝，并告诉家人或朋友","Send half to be safe":"为保险起见，汇一半","This is a \"romance\" or \"friendship\" scam. The criminal builds trust for weeks, then invents an emergency. They often say they cannot video call.":"这是“情感”或“友谊”骗局。骗子先花几周时间建立信任，然后编造紧急情况。他们常说自己无法视频通话。","Never send money to someone you have only met online.":"切勿汇款给只在网上认识的人。","A pop-up shouts: \"VIRUS FOUND! Call this number now!\" What do you do?":"弹出窗口大喊：“发现病毒！立即拨打这个号码！”您会怎么做？","Call the number - they can fix it":"拨打这个号码——他们能修好","Close the window or turn off the device, and do not call":"关闭窗口或关掉设备，不要拨打","Click \"Scan now\"":"点击“立即扫描”","Real security warnings do not show a phone number. The people who answer will ask to control your computer and charge you.":"真正的安全警告不会显示电话号码。接电话的人会要求控制您的电脑并向您收费。","A pop-up is not your computer talking. Close it.":"弹出窗口不是您的电脑在说话。关掉它。","Bank Security Team":"银行安全团队","\"To stop a fraud, please read us the 6-digit code we just sent to your phone.\"":"“为了阻止诈骗，请把我们刚发到您手机上的 6 位数验证码念给我们。”","Read the code - they are protecting me":"念出验证码——他们在保护我","Hang up. That code is only for me and I never share it":"挂断。这个验证码只属于我，我从不告诉别人","Read only the first 3 digits":"只念前 3 位数字","That code is the key to your account. The bank sent it because the scammer is trying to log in as you at that very moment.":"这个验证码是您账户的钥匙。银行发送它，是因为骗子此刻正试图冒充您登录。","No real company will ever ask you to read out a code.":"任何正规公司都绝不会要求您念出验证码。","You want to check your bank balance on the free cafe Wi-Fi. What is best?":"您想用咖啡店的免费 Wi- e against you.":"公开发帖说家里没人，会招来窃贼。这也会给骗子提供可以用来对付您的细节。","Post holiday photos after you are home.":"度假照片请回到家后再发。","Your friend Linda":"您的朋友琳达","OMG is this you in this video?? 😱":"天哪，这是你吗？这个视频里！！😱","http://watch-video.example/linda":"http://watch-video.example/linda","It seems to be from your friend Linda. What do you do?":"这好像是您的朋友琳达发来的。您会怎么做？","Tap the link right away":"马上点击链接","Contact Linda another way, like a phone call, to ask if she sent it":"用其他方式联系琳达，比如打电话，问她是不是她发的","Forward it to my other friends":"转发给我其他朋友","Scammers hack accounts and message the contacts. The link may steal your password. Real friends will confirm when you ask.":"骗子入侵账户后，会给联系人发信息。这个链接可能会窃取您的密码。真正的朋友在您询问时会确认。","A message from a friend can still be from a hacker.":"朋友发来的信息，也可能出自黑客之手。","Big sale!":"大促销！","New tablet at half price. Pay by bank transfer only. Only 2 left!":"全新平板电脑半价。只接受银行转账。仅剩 2 台！","You have never heard of this shop. What do you do?":"您从没听说过这家商店。您会怎么做？","Buy it fast before it sells out":"赶紧买，卖完就没了","Skip it, and buy from a shop I know, paying by card":"不买，改到我熟悉的商店，用银行卡付款","Transfer half now and half later":"现在转一半，以后再转一半","Prices that are too good, a rush, and \"transfer only\" are red flags. A credit card gives you the best chance of getting a refund.":"价格好得离谱、催促下单、“只接受转账”，都是危险信号。信用卡最有可能让您拿回退款。","Bank transfer only? Walk away.":"只接受银行转账？转身走人。","Prize Draw Team":"抽奖团队","You won a FREE cruise!":"您赢得了免费邮轮之旅！","You were selected! Reply with your ID number and card number to claim your two-week cruise for two.":"您被选中了！请回复您的身份证号码和银行卡号，领取您的两人两周邮轮之旅。","Claim prize":"领取奖品","You cannot win a contest you did not enter, and no prize needs your ID and card number.":"您没参加的比赛不可能中奖，而且任何奖品都不需要您的身份证号码和银行卡号。","Real prizes never ask for your card number.":"真正的奖品绝不会要求您提供银行卡号。","\"Your Bank\"":"“您的银行”","\"Before we talk, please confirm your date of birth and full card number.\"":"“在我们通话前，请先确认您的出生日期和完整的银行卡号。”","What is the smart move?":"怎样做才明智？","Confirm them - it is my bank":"确认——这是我的银行","Say I will 固的锁","Thieves use computers that guess millions of passwords a second.":"窃贼使用的电脑每秒能猜上百万个密码。","PAY FOR PARKING":"缴付停车费","Scan here - fast and easy!":"在此扫描——又快又方便！","A sticker on the parking meter":"停车计时器上的贴纸","⚠ VIRUS FOUND! ⚠":"⚠ 发现病毒！⚠","Your computer is infected. Do not turn off.":"您的电脑已被感染。请勿关机。","Call 1-800-000-0000 NOW":"立即拨打 1-800-000-0000","New message":"新信息","BONUS ROUND":"奖励回合","BONUS":"奖励","LIGHTNING SPIN":"闪电转盘","Play the bonus":"开始奖励回合","Scam or safe?":"骗局还是安全？","Next card":"下一张卡片","Collect my coins":"领取我的金币","+200 coins!":"+200 金币！","Not this time":"这次不对","BONUS JACKPOT!":"奖励大奖！","BONUS DONE":"奖励回合结束","Nice try! Get all 3 next time for a 300 coin jackpot.":"不错！下次全部答对 3 张，可赢得 300 金币大奖。","200 coins":"200 金币",". All three wins a":"。全部答对可获得","300 coin jackpot":"300 金币大奖","!":"！","+300 coin":"+300 金币","jackpot.":"大奖。","YOU HIT THE JACKPOT!":"您赢得了大奖！","Scam Buster Champion":"骗局克星冠军","Sharp-Eyed Guardian":"火眼金睛守护者","Getting Savvy":"越来越精明","Learning Fast":"学得真快","You are protecting yourself and the people you love. Share these six rules with a friend.":"您正在保护自己和所爱的人。把这六条规则分享给朋友吧。","The six golden rules":"六条黄金规则","Worth another look":"值得再看一遍","A perfect round - nothing missed!":"完美的一轮——一题都没错！","Saving your score...":"正在保存您的分数……","Score saved to the shared leaderboard.":"分数已保存到共享排行榜。","Score saved on this device.":"分数已保存在此设备上。","Could not save your score to the leaderboard.":"无法将您的分数保存到排行榜。","Play again":"再玩一次","It is a tie!":"平局！","LEADERBOARD":"排行榜","TOP 20 SCORES":"前 20 名","20 balls (solo, 2 teams)":"20 个球（单人、2 队）","30 balls (3-4 teams)":"30 个球（3-4 队）","Loading scores...":"正在加载分数……","Refresh scores":"刷新分数","Refreshing...":"正在刷新……","Close":"关闭","No scores yet - be the first!":"还没有分数——来当第一个吧！","Could not load scores. Please press Refresh.":"无法加载分数。请按“刷新分数”。","Solo":"单人","View leaderboard":"查看排行榜","Glitchy picture":"画面有故障","AI-GENERATED FAKE VIDEO EXAMPLE":"AI 生成的虚假视频示例"};
let lang='en';try{lang=localStorage.getItem('ss_lang')==='zh'?'zh':'en'}catch(e){}
const orig=new WeakMap();
const TNM={red:'红队',blue:'蓝队',green:'绿队',purple:'紫队'};
const hasZ=x=>Object.prototype.hasOwnProperty.call(ZH,x);
const zt=x=>hasZ(x)?ZH[x]:(/^team (red|blue|green|purple)$/i.test(x)?TNM[x.split(' ')[1].toLowerCase()]:x);
const PAT=[
[/^Text size: (.+)$/,m=>'字体大小：'+m[1]],
[/^Sound: (on|off)$/,m=>'声音：'+(m[1]==='on'?'开':'关')],
[/^Played: (\d+) of (\d+)$/,m=>`已玩：${m[1]} / ${m[2]}`],
[/^Ball (\d+) of (\d+)$/,m=>`第 ${m[1]} 个球（共 ${m[2]} 个）`],
[/^Coins: ● (\d+)$/,m=>'金币：● '+m[1]],
[/^LUCKY (\d+)$/,m=>'幸运 '+m[1]],
[/^team (red|blue|green|purple)$/i,m=>TNM[m[1].toLowerCase()]],
[/^(.+): it is your turn!$/,m=>zt(m[1])+'：轮到您了！'],
[/^(.+): SPIN!$/,m=>zt(m[1])+'：转动！'],
[/^(\d) teams$/,m=>m[1]+' 个队'],
[/^CARD (\d) OF 3 · \+200 COINS EACH$/,m=>`第 ${m[1]} 张，共 3 张 · 每张 +200 金币`],
[/^(\d) OF 3 RIGHT$/,m=>`答对 ${m[1]} / 3`],
[/^You reached (\d+) balls! Three quick cards\. Each right answer wins$/,m=>`您已玩了 ${m[1]} 个球！三张快速卡片，每答对一张赢得`],
[/^Perfect! You earned a$/,()=>'太棒了！您赢得了'],
[/^ALL (\d+) BALLS PLAYED$/,m=>`已玩完全部 ${m[1]} 个球`],
[/^● (\d+) coins won$/,m=>`● 共赢得 ${m[1]} 金币`],
[/^(\d+) right$/,m=>`答对 ${m[1]} 题`],
[/^(.+) wins!$/,m=>zt(m[1])+' 获胜！'],
[/^You found (\d+) of (\d+) warning signs\. Green = you caught it, red = missed\.$/,m=>`您找出了 ${m[2]} 个警示信号中的 ${m[1]} 个。绿色 = 您找到了，红色 = 漏掉了。`],
[/^- (.+)$/,m=>'- '+zt(m[1])],
[/^Remember: (.+)$/,m=>'记住：'+zt(m[1])],
[/^(Shared scores from everyone playing\.|Scores saved on this device only\.) Updated (.+)$/,m=>(m[1][0]==='S'&&m[1][1]==='h'?'来自所有玩家的共享分数。':'分数仅保存在此设备上。')+' 更新于 '+m[2]],
[/^🏆 (.+)$/u,m=>'🏆 '+zt(m[1])],
[/^(.+):$/,m=>zt(m[1])+'：']
];
function trText(s){
  const core=s.trim();if(!core)return s;
  let z;
  if(hasZ(core))z=ZH[core];
  else for(const [re,fn] of PAT){const m=core.match(re);if(m){z=fn(m);break}}
  if(z===undefined||z===core)return s;
  return s.slice(0,s.indexOf(core))+z+s.slice(s.indexOf(core)+core.length);
}
function trNode(n){const p=n.parentNode;if(!p||/^(SCRIPT|STYLE)$/.test(p.nodeName))return;const s=n.nodeValue,z=trText(s);if(z!==s){if(!orig.has(n))orig.set(n,s);n.nodeValue=z}}
function trEl(root){
  if(!root)return;
  if(root.nodeType===3){trNode(root);return}
  if(root.nodeType!==1)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),list=[];
  while(w.nextNode())list.push(w.currentNode);
  list.forEach(trNode);
  const els=[...root.querySelectorAll('[placeholder],input')];
  if(root.matches&&root.matches('[placeholder],input'))els.push(root);
  els.forEach(e=>{const ph=e.getAttribute('placeholder');if(ph&&hasZ(ph))e.setAttribute('placeholder',ZH[ph]);
    if(e.tagName==='INPUT'){const m=/^team (red|blue|green|purple)$/i.exec(e.value);if(m&&e.defaultValue===e.value)e.value=TNM[m[1].toLowerCase()]}});
}
new MutationObserver(recs=>{if(lang!=='zh')return;recs.forEach(r=>r.addedNodes.forEach(trEl))}).observe(document.body,{childList:true,subtree:true});

/* remember which screen is showing so a language change can redraw it */
let curView=null;
(function(){
  const o={start,setup,board,end};
  start=function(){curView=()=>o.start();return o.start()};
  setup=function(n){curView=()=>o.setup(n);return o.setup(n)};
  board=function(){curView=()=>o.board();return o.board()};
  end=function(a){if(a!==true)curView=()=>o.end(true);return o.end(a)};
})();
const langBtn=document.getElementById('langbtn');
function setLang(l){
  if(busy)return;
  lang=l;try{localStorage.setItem('ss_lang',l)}catch(e){}
  document.documentElement.lang=l==='zh'?'zh-Hans':'en';
  const top=document.querySelector('.top');
  if(l==='zh')trEl(top);
  else{const w=document.createTreeWalker(top,NodeFilter.SHOW_TEXT),a=[];while(w.nextNode())a.push(w.currentNode);a.forEach(n=>{if(orig.has(n)){n.nodeValue=orig.get(n);orig.delete(n)}})}
  langBtn.textContent=l==='zh'?'English':'中文';
  if(curView)curView();
}
langBtn.onclick=()=>setLang(lang==='zh'?'en':'zh');
function setLangInit(){
  if(lang==='zh'){document.documentElement.lang='zh-Hans';langBtn.textContent='English';trEl(document.querySelector('.top'))}
}

setLangInit();start();
</script>
